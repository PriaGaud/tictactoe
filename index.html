<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-gap: 10px;
            margin-bottom: 20px;
        }

        .cell {
            width: 80px;
            height: 80px;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .cell:hover {
            background-color: #e0e0e0;
        }

        .status {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .reset-button {
            padding: 10px 10px;
            font-size: 18px;
            cursor: pointer;
            background-color: #adaf4c;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .reset-button:hover {
            background-color: #45a049;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        #overlayText {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe Game</h1>
        <div class="status">Player X's turn</div>
        <div class="grid">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button class="reset-button">Reset Game</button>
    </div>

    <div id="overlay">
        <div id="overlayText"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cells = document.querySelectorAll('.cell');
            const statusText = document.querySelector('.status');
            const resetButton = document.querySelector('.reset-button');
            const overlay = document.getElementById('overlay');
            const overlayText = document.getElementById('overlayText');
            let board = ['', '', '', '', '', '', '', '', ''];
            let currentPlayer = 'X';
            let isGameActive = true;
        
            const winningConditions = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];
        
            const handleCellClick = (event) => {
                const cell = event.target;
                const cellIndex = parseInt(cell.getAttribute('data-index'));
        
                if (board[cellIndex] !== '' || !isGameActive) {
                    return;
                }
        
                board[cellIndex] = currentPlayer;
                cell.textContent = currentPlayer;
        
                if (checkWinner()) {
                    showOverlay(`Player ${currentPlayer} wins!`);
                    isGameActive = false;
                    return;
                } 
        
                if (board.every(cell => cell !== '')) {
                    showOverlay('It\'s a draw!');
                    isGameActive = false;
                    return;
                }
        
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                statusText.textContent = `Player ${currentPlayer}'s turn`;
        
                if (currentPlayer === 'O' && isGameActive) {
                    setTimeout(computerPlay, 500); // Delay AI move
                }
            };
        
            const computerPlay = () => {
                if (!isGameActive) return;
        
                const bestMove = findBestMove();
                board[bestMove] = 'O';
                cells[bestMove].textContent = 'O';
        
                if (checkWinner()) {
                    showOverlay('Player O wins!');
                    isGameActive = false;
                    return;
                } 
        
                if (board.every(cell => cell !== '')) {
                    showOverlay('It\'s a draw!');
                    isGameActive = false;
                    return;
                }
        
                currentPlayer = 'X';
                statusText.textContent = `Player ${currentPlayer}'s turn`;
            };
        
            const findBestMove = () => {
                for (let i = 0; i < 9; i++) {
                    if (board[i] === '') {
                        board[i] = 'O';
                        if (checkWinner()) {
                            board[i] = '';
                            return i;
                        }
                        board[i] = '';
                    }
                }
        
                for (let i = 0; i < 9; i++) {
                    if (board[i] === '') {
                        board[i] = 'X';
                        if (checkWinner()) {
                            board[i] = '';
                            return i;
                        }
                        board[i] = '';
                    }
                }
        
                const emptyCells = board.map((cell, index) => cell === '' ? index : null).filter(index => index !== null);
                return emptyCells[Math.floor(Math.random() * emptyCells.length)];
            };
        
            const checkWinner = () => {
                for (const condition of winningConditions) {
                    const [a, b, c] = condition;
                    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                        return true;
                    }
                }
                return false;
            };
        
            const showOverlay = (message) => {
                overlayText.textContent = message;
                overlay.style.display = 'flex'; // Show the overlay
            };
        
            const hideOverlay = () => {
                overlay.style.display = 'none'; // Hide the overlay
            };
        
            const resetGame = () => {
                board = ['', '', '', '', '', '', '', '', ''];
                isGameActive = true;
                currentPlayer = 'X';
                statusText.textContent = `Player ${currentPlayer}'s turn`;
                cells.forEach(cell => cell.textContent = '');
                hideOverlay(); // Hide overlay on reset
            };
        
            cells.forEach(cell => cell.addEventListener('click', handleCellClick));
            resetButton.addEventListener('click', resetGame);
        
            // Prevent overlay from being hidden by clicks outside
            overlay.addEventListener('click', (event) => {
                if (event.target === overlay) {
                    hideOverlay();
                }
            });
        });
        
    </script>
</body>
</html>
